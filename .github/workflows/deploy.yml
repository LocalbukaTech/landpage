name: Vercel Deployments

on:
  push:
    branches:
      - main
      - develop

jobs:
  validate-actor:
    runs-on: ubuntu-latest
    steps:
      - name: Check user permissions
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            ALLOWED_USERS="codydematth TobiAkinkuotu LocalbukaTech tobiakinkuotu github-actions[bot]"
            ACTOR="${{ github.actor }}"

            matched=false
            for u in $ALLOWED_USERS; do
              if [ "$(echo "$u" | tr '[:upper:]' '[:lower:]')" = "$(echo "$ACTOR" | tr '[:upper:]' '[:lower:]')" ]; then
                matched=true
                break
              fi
            done

            if [ "$matched" = false ]; then
              echo "❌ Error: User '$ACTOR' is not permitted to push directly to the main branch."
              exit 1
            fi
            echo "✅ Authorization successful for user '$ACTOR' on main."
          else
            echo "✅ Branch '${{ github.ref_name }}' does not require main-branch restriction."
          fi

  deploy:
    needs: validate-actor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_FLAG=production" >> $GITHUB_ENV
            echo "PROD_FLAG=--prod" >> $GITHUB_ENV
          else
            echo "ENV_FLAG=preview" >> $GITHUB_ENV
            echo "PROD_FLAG=" >> $GITHUB_ENV
          fi

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ env.ENV_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build ${{ env.PROD_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt ${{ env.PROD_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
